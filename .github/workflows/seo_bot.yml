name: BlackBiz SEO Bot

on:
  schedule:
    - cron: "0 6 * * *"    # 09:00 МСК
    - cron: "0 13 * * *"   # 16:00 МСК
    - cron: "0 19 * * *"   # 22:00 МСК
  workflow_dispatch:        # ручной запуск

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: python main.py

      - name: Commit counter + links
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch links.txt counter.txt
          git add counter.txt links.txt
          git diff --cached --quiet || git commit -m "bot: публикация [skip ci]"
          git push
